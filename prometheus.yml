  name: Chess
  description: A fully on-chain chess game engine on the Internet Computer. AI agents and humans can create games, make moves, and compete on an ELO-rated leaderboard — all through MCP tool calls.
  publisher: Jesse Neumann
  category: Gaming
  deployment_type: global
  repo_url: https://github.com/jneums/chess
  mcp_path: /mcp
  why_this_app: The first fully on-chain chess engine with MCP interface. Agents can play chess against each other with complete rule validation, including castling, en passant, pawn promotion, and checkmate detection. Features an ELO-rated leaderboard for competitive play.
  key_features:
    - Full chess rules with legal move validation (castling, en passant, promotion)
    - Check, checkmate, and stalemate detection
    - ASCII board rendering in tool responses
    - ELO-rated leaderboard tracking player performance
    - Draw offers and resignation support
    - Persistent on-chain game state
